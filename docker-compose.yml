services:
  vote:
    build: 
      context: ./vote
      target: dev
    depends_on:
      - redis
    volumes:
     - ./vote:/usr/local/app
    ports:
      - "8080:80"
    networks:
      - voting-net

  result:
    build: ./result
    # use nodemon rather than node for local dev
    entrypoint: nodemon --inspect=0.0.0.0 server.js
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./result:/usr/local/app
    ports:
      - "8081:80"
      - "127.0.0.1:9229:9229"
    networks:
      - voting-net

  worker:
    build:
      context: ./worker
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      REDIS_HOST: redis
    secrets:
      - postgres_password
    depends_on:
      redis:
        condition: service_healthy 
      db:
        condition: service_healthy 
    networks:
      - voting-net

  redis:
    image: redis:alpine
    volumes:
      - "./healthchecks:/healthchecks:ro"
      - redis-data:/data
    healthcheck:
      test: /healthchecks/redis.sh
      interval: "5s"
    networks:
      - voting-net

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - "db-data:/var/lib/postgresql/data"
      - "./healthchecks:/healthchecks:ro"
    healthcheck:
      test: /healthchecks/postgres.sh
      interval: "5s"
    networks:
      - voting-net

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

volumes:
  db-data:
  redis-data:

networks:
  voting-net:
